services:
  - type: web
    name: urbisora-africa
    runtime: docker
    plan: free
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /healthz/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.dummy.EmailBackend
      - key: DJANGO_SUPERUSER_USERNAME
        value: urbisora_admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@urbisora.local
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
      - key: SQLITE_PATH
        value: /tmp/urbisora.sqlite3
