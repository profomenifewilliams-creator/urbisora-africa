services:
  - type: web
    name: urbisora-africa
    runtime: docker
    plan: free
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /healthz/
    envVars:
      - key: DEBUG
        value: "False"
      - key: RENDER
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.dummy.EmailBackend
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: MEDIA_ROOT
        value: /tmp/urbisora-media
      - key: DJANGO_SUPERUSER_USERNAME
        value: urbisora_admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@urbisora.local
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: urbisora-africa-db
          property: connectionString

databases:
  - name: urbisora-africa-db
    databaseName: urbisora_africa_db
    user: urbisora_africa_db_user
    plan: free
    region: frankfurt
    postgresMajorVersion: 16
